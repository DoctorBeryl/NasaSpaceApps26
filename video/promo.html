<title>AstraSight promo</title>
<!--
  AstraSight 30-second promo. One timeline drives everything:
    0–4 s    side shot: stickman pushes off the smart handrails, drifting diagonally left
    4–7 s    hyper-zoom on the hand at rail 3B, car-edit strobe readouts
    7–12 s   locked-off back shot: he floats to the hatch, it opens on a window, a distant light
    12–14 s  warp zoom into the light, white flash, then silence
    14–15 s  black
    15–26 s  the real website (frames recorded by capture_site.py), punch zooms and captions
    26–30 s  title card
  Open with ?play to watch it in the browser (with the sound-effect track if it has been built).
  render.py calls PROMO.seek(t) for every frame and screenshots the 1920×1080 stage.
-->

<style>

  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 50% 50%; color: var(--text); font-family: var(--sans); }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* website frames */
  #site { display: none; background: var(--bg); }
  #site img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  #site .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  #crt { position: absolute; left: 0; right: 0; top: 50%; height: 0; background: #fff; box-shadow: 0 0 40px 10px var(--cyan); transform: translateY(-50%); opacity: 0; }

  /* film look */
  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: var(--bar, 0px); background: #000; }
  #bars::before { top: 0; } #bars::after { bottom: 0; }
  #vignette { background: radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,.6) 100%); }
  #scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; opacity: .5; }
  #flash { background: #fff; opacity: 0; }
  #black { background: #000; opacity: 0; }
  #rgb { opacity: 0; mix-blend-mode: screen; }

  /* corner HUD text in the station shots */
  #corner { left: 70px; top: 120px; right: auto; bottom: auto; font: 600 17px/1.75 var(--mono); letter-spacing: .14em; color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.6); white-space: pre; opacity: 0; }
  #corner b { color: #fff; font-weight: 600; }

  /* rail reticle + readouts */
  #reticle { width: 220px; height: 220px; left: 0; top: 0; inset: auto; opacity: 0; }
  #reticle svg { width: 100%; height: 100%; overflow: visible; }
  .readout { position: absolute; left: 0; top: 0; transform-origin: 0 50%; white-space: nowrap; opacity: 0; padding: 22px 30px 24px 26px; background: rgba(2,8,16,.72); border-left: 6px solid var(--cyan); box-shadow: 0 0 30px rgba(0,240,255,.15); }
  .readout .lbl { display: block; font: 400 15px/1 var(--pixel); color: var(--pink); letter-spacing: .04em; text-shadow: 0 0 12px rgba(255,42,133,.7); margin-bottom: 14px; }
  .readout .val { display: block; font: 400 64px/1 var(--pixel); color: #fff; text-shadow: 0 0 18px rgba(0,240,255,.9), 3px 0 0 rgba(255,42,133,.85), -3px 0 0 rgba(0,240,255,.85); }
  .readout .val small { font-size: .45em; color: var(--cyan); margin-left: 12px; text-shadow: 0 0 10px rgba(0,240,255,.8); }
  .readout .sub { display: block; font: 600 18px/1 var(--mono); color: var(--amber); letter-spacing: .1em; margin-top: 14px; text-shadow: 0 0 10px rgba(255,184,0,.6); }
  #simtag { left: auto; top: auto; right: 64px; bottom: 120px; padding: 8px 12px; background: rgba(2,8,16,.75); font: 600 14px/1 var(--mono); letter-spacing: .2em; color: var(--amber); opacity: 0; }

  /* website captions */
  #cap { left: 72px; top: auto; bottom: 86px; right: auto; padding: 22px 30px 24px 26px; background: rgba(2,8,16,.88); border: 1px solid rgba(0,240,255,.5); border-left: 6px solid var(--cyan); box-shadow: 0 0 40px rgba(0,240,255,.18); opacity: 0; max-width: 1100px; }

  #cap .k::before { content: ""; width: 10px; height: 10px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  #cap .t { font: 800 46px/1.1 var(--sans); color: #fff; letter-spacing: -.01em; }

  #title::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,240,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 75%); }
  #title > * { position: relative; }
  #title .eyebrow { font: 400 18px/1 var(--pixel); color: var(--pink); text-shadow: 0 0 14px rgba(255,42,133,.6); letter-spacing: .04em; }
  #title .brand { display: flex; align-items: center; gap: 34px; margin: 46px 0 30px; }
  #title .brand svg { width: 150px; height: 150px; filter: drop-shadow(0 0 22px rgba(0,240,255,.55)); }
  #title .brand span { font: 800 150px/1 var(--sans); letter-spacing: -.035em; color: #fff; text-shadow: 0 0 40px rgba(0,240,255,.35); }
  #title .tag { font: 600 44px/1.2 var(--sans); color: var(--cyan); text-shadow: 0 0 22px rgba(0,240,255,.45); }
  #title .what { margin-top: 40px; font: 400 26px/1.5 var(--mono); color: #cfe6f3; letter-spacing: .02em; }
  #title .disc { position: absolute; bottom: 70px; font: 600 17px/1 var(--mono); color: var(--amber); letter-spacing: .18em; }
  #title .t-a, #title .t-b, #title .t-c, #title .t-d { opacity: 0; }

  #loading { position: fixed; left: 16px; bottom: 16px; font: 12px var(--mono); color: #789; }

<script type="module">

const renderer = new THREE.WebGLRenderer({ canvas: $("#gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);

renderer.toneMappingExposure = 0.8;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.12;
const camera = new THREE.PerspectiveCamera(50, W / H, 0.03, 2000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.5, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ======================= materials ======================= */
const M = {
  panel: new THREE.MeshStandardMaterial({ color: 0x5d6873, roughness: .6, metalness: .15 }),
  panelDark: new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: .7, metalness: .2 }),
  rib: new THREE.MeshStandardMaterial({ color: 0x39424d, roughness: .4, metalness: .6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: .35, metalness: .7 }),
  light: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xd8ecff, emissiveIntensity: 1.05 }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 2.0 }),
  pink: new THREE.MeshStandardMaterial({ color: 0xff2a85, emissive: 0xff2a85, emissiveIntensity: 1.6 }),
  amber: new THREE.MeshStandardMaterial({ color: 0xffb800, emissive: 0xffb800, emissiveIntensity: 1.8 }),
  green: new THREE.MeshStandardMaterial({ color: 0x34d399, emissive: 0x34d399, emissiveIntensity: 1.8 }),
  body: new THREE.MeshStandardMaterial({ color: 0xe8edf2, roughness: .38, metalness: 0, emissive: 0x9fb4c8, emissiveIntensity: .06 }),
  visor: new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 3.0 }),
};

/* ======================= station corridor ======================= */
const A = 1.8;                         // octagon apothem (wall distance from the axis)
const SIDE = 2 * A * Math.tan(Math.PI / 8);
const Z_NEAR = 3, Z_HATCH = -17;
const station = new THREE.Group(); scene.add(station);

function octPanel(k, z0, z1, mat, inset = 0, w = SIDE - 0.05, thick = 0.06) {
  const th = k * Math.PI / 4;
  const m = new THREE.Mesh(new THREE.BoxGeometry(thick, w, Math.abs(z1 - z0) - 0.04), mat);
  const d = A + thick / 2 - inset;
  m.position.set(Math.cos(th) * d, Math.sin(th) * d, (z0 + z1) / 2);
  m.rotation.z = th;
  station.add(m);
  return m;
}
function octRing(z, depth, inner, mat) {
  for (let k = 0; k < 8; k++) octPanel(k, z - depth / 2, z + depth / 2 + 0.04, mat, inner, SIDE + 0.02, 0.05 + inner);
}

for (let z = Z_NEAR; z > Z_HATCH + 0.01; z -= 2) {
  const z1 = Math.max(z - 2, Z_HATCH);
  for (let k = 0; k < 8; k++) {
    const dark = (k === 0 || k === 4) && rnd() < .28;
    octPanel(k, z, z1, dark ? M.panelDark : M.panel);
    // lockers / insets with status LEDs on the side walls
    if ((k === 0 || k === 4) && rnd() < .55) {
      const inset = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.5 + rnd() * .4, 0.5 + rnd() * .6), M.panelDark);
      const s = k === 0 ? 1 : -1;
      inset.position.set(s * (A - 0.005), -0.55 + rnd() * .2, z - 1 + (rnd() - .5) * .6);
      station.add(inset);
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.025, 0.025), rnd() < .7 ? M.green : M.amber);
      led.position.copy(inset.position).add(V3(-s * 0.012, .18, .16));
      station.add(led);
    }
  }
  // rib frame at every segment joint
  octRing(z, 0.12, 0.07, M.rib);
  // ceiling light panel
  const lp = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.15), M.light);
  lp.rotation.x = Math.PI / 2; lp.position.set(0, A - 0.01, z - 1); station.add(lp);
  // accent strips: cyan on the upper chamfers, pink on the lower ones every other segment
  for (const k of [1, 3]) {
    const th = k * Math.PI / 4, d = A - 0.02;
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.04, 1.7), M.cyan);
    s.position.set(Math.cos(th) * d, Math.sin(th) * d, z - 1); s.rotation.z = th; station.add(s);
  }
  if (Math.round(z) % 4 === 0) for (const k of [5, 7]) {
    const th = k * Math.PI / 4, d = A - 0.02;
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.03, 1.2), M.pink);
    s.position.set(Math.cos(th) * d, Math.sin(th) * d, z - 1); s.rotation.z = th; station.add(s);
  }
}
{ const shell = new THREE.Mesh(new THREE.CylinderGeometry(2.25, 2.25, Z_NEAR - Z_HATCH, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0x05080c, side: THREE.BackSide }));
  shell.rotation.x = Math.PI / 2; shell.position.z = (Z_NEAR + Z_HATCH) / 2; station.add(shell); }
// near end cap
{ const cap = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), M.panelDark); cap.position.z = Z_NEAR; cap.rotation.y = Math.PI; station.add(cap); }

// lights
for (let z = 1; z > Z_HATCH; z -= 4) {
  const l = new THREE.PointLight(0xe6f2ff, 2.2, 6.5, 1.8); l.position.set(0, 1.3, z); scene.add(l);
}
scene.add(new THREE.HemisphereLight(0x9fcfff, 0x0a1018, 0.18));

/* ======================= smart handrails ======================= */
function labelTexture(lines) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#0b1420"; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = "#00f0ff"; g.lineWidth = 6; g.strokeRect(6, 6, 244, 116);
  g.fillStyle = "#00f0ff"; g.font = "bold 64px 'JetBrains Mono', monospace"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(lines[0], 128, 54);
  g.fillStyle = "#ff2a85"; g.font = "bold 22px 'JetBrains Mono', monospace"; g.fillText(lines[1], 128, 100);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const RAIL_X = A - 0.14;      // rail axis distance from the corridor axis
const rails = [];
function addRail(side, y, z, name) {
  const g = new THREE.Group();
  const x = side * RAIL_X;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.56, 16), M.metal);
  bar.rotation.x = Math.PI / 2; g.add(bar);
  for (const dz of [-0.26, 0.26]) {
    const so = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), M.metal);
    so.position.set(side * 0.07, 0, dz); g.add(so);
  }
  const sensMat = M.cyan.clone();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.0255, 0.0255, 0.2, 16), sensMat);
  band.rotation.x = Math.PI / 2; g.add(band);
  const glowMat = M.cyan.clone(); glowMat.emissiveIntensity = .7;
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.035, 0.62), glowMat);
  strip.position.set(side * 0.135, -0.07, 0); g.add(strip);
  if (name) {
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.08), new THREE.MeshBasicMaterial({ map: labelTexture([name, "LOAD·PPG·EDA"]), toneMapped: false }));
    plate.position.set(side * 0.1, 0.11, 0.17); plate.rotation.y = -side * Math.PI / 2; g.add(plate);
  }
  g.position.set(x, y, z);
  station.add(g);
  const r = { side, y, z, grip: V3(x - side * 0.035, y, z), sensMat, glowMat, touches: [] };
  rails.push(r); return r;
}
const leftRails = {};
for (let z = -1; z >= -15; z -= 2) leftRails[z] = addRail(-1, 0.05, z, z === -9 ? "3B" : null);
for (let z = -2; z >= -16; z -= 2) addRail(1, 0.05, z, null);
for (let z = -1.5; z >= -15.5; z -= 3.5) { // ceiling rails
  const r = addRail(1, 0, z, null); r.grip = null;
}
// move the "ceiling" rails up: rotate their groups to sit under the ceiling
station.children.filter((o) => o.isGroup && Math.abs(o.position.x - RAIL_X) < 1e-6 && o.position.y === 0).forEach((g) => {
  g.position.set(0.0, A - 0.14, g.position.z); g.rotation.z = Math.PI / 2;
});

/* ======================= hatch, vestibule, window, space ======================= */
const hatch = new THREE.Group(); scene.add(hatch);
{

  const bulk = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: false, curveSegments: 64 }), M.panel);
  bulk.position.z = Z_HATCH - 0.16; hatch.add(bulk);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.06, 16, 96), M.rib); ring.position.z = Z_HATCH + 0.01; hatch.add(ring);
  const glow = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.014, 8, 128), M.cyan.clone()); glow.position.z = Z_HATCH + 0.01; hatch.add(glow);
  hatch.userData.glow = glow;
  hatch.userData.leds = [];
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.02), M.amber.clone());
    led.position.set(Math.cos(a) * 1.22, Math.sin(a) * 1.22, Z_HATCH + 0.02); hatch.add(led); hatch.userData.leds.push(led);
  }
  // the door: sits inside the bulkhead and slides into the wall pocket
  const door = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.97, 0.97, 0.07, 64), M.panel);
  disc.rotation.x = Math.PI / 2; door.add(disc);
  const dring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.012, 8, 96), M.cyan.clone()); dring.position.z = 0.04; door.add(dring);
  const hub = new THREE.Group();
  const hubC = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.06, 32), M.metal); hubC.rotation.x = Math.PI / 2; hub.add(hubC);
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.04), M.metal);
    arm.position.z = 0.03; arm.rotation.z = i * Math.PI / 4; hub.add(arm);
  }
  hub.position.z = 0.05; door.add(hub);
  door.position.set(0, 0, Z_HATCH - 0.08);
  hatch.add(door);
  hatch.userData.door = door; hatch.userData.hub = hub; hatch.userData.dring = dring;
  // vestibule tube and the observation window

function twoBone(S, T, a, b, pole) {
  const dir = T.clone().sub(S); let d = dir.length(); dir.normalize();
  d = clamp(d, 0.05, a + b - 0.002);
  const cosA = clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
  const p = pole.clone().addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = S.clone().addScaledVector(dir, a * cosA).addScaledVector(p, a * Math.sqrt(1 - cosA * cosA));
  const Tn = S.clone().addScaledVector(dir, d);
  return [E, Tn];
}

// body centre path (scene time τ → position)
const PATH = [
  [0.0, -0.55, 0.20, -1.2], [1.0, -1.12, 0.00, -3.1], [2.0, -1.25, -0.10, -5.0], [3.0, -1.25, -0.10, -6.9],
  [4.0, -1.25, -0.10, -8.8], [5.0, -1.24, -0.10, -10.8], [6.0, -1.12, -0.06, -12.9], [6.8, -0.75, 0.0, -14.5],
  [7.6, -0.35, 0.05, -15.55], [8.4, -0.27, 0.05, -15.9], [9.2, -0.28, 0.05, -15.98], [20, -0.28, 0.05, -16.0],
];
function bodyPos(t) {
  const P = PATH; t = clamp(t, P[0][0], P[P.length - 1][0]);
  let i = 0; while (i < P.length - 2 && t > P[i + 1][0]) i++;
  const p = (k) => V3(P[k][1], P[k][2], P[k][3]);
  const tan = (k) => {
    const a = P[Math.max(0, k - 1)], b = P[Math.min(P.length - 1, k + 1)];
    const dt = b[0] - a[0] || 1; return V3((b[1] - a[1]) / dt, (b[2] - a[2]) / dt, (b[3] - a[3]) / dt);
  };
  const t0 = P[i][0], t1 = P[i + 1][0], h = t1 - t0, s = (t - t0) / h;
  const h00 = 2 * s ** 3 - 3 * s ** 2 + 1, h10 = s ** 3 - 2 * s ** 2 + s, h01 = -2 * s ** 3 + 3 * s ** 2, h11 = s ** 3 - s ** 2;
  return p(i).multiplyScalar(h00).add(tan(i).multiplyScalar(h10 * h)).add(p(i + 1).multiplyScalar(h01)).add(tan(i + 1).multiplyScalar(h11 * h));
}
const bodyVel = (t) => bodyPos(t + .03).sub(bodyPos(t - .03)).divideScalar(.06);

function frame(t) {
  const C = bodyPos(t);
  if (t > 8.4) C.y += Math.sin(t * 1.3) * 0.012;
  const u = smooth(6.6, 8.1, t);                                  // 0 = flying, 1 = upright at the hatch
  const v = bodyVel(t); const d = v.length() > .15 ? v.clone().normalize() : V3(0, 0, -1);
  const axisF = d.clone().multiplyScalar(.75).add(V3(0, .55, 0)).normalize();
  const axis = axisF.clone().lerp(V3(0, 1, 0), u).normalize();
  const front = V3(-1, -.2, 0).lerp(V3(0, 0, -1), u);
  front.addScaledVector(axis, -front.dot(axis)).normalize();
  const right = front.clone().cross(axis).normalize();

}
const shoulder = (f, s) => f.C.clone().addScaledVector(f.axis, 0.32).addScaledVector(f.right, s * 0.2);

// grab schedule: which hand takes which rail; windows are solved from the path so the reach always fits
const GRABS = [{ hand: -1, z: -3 }, { hand: 1, z: -5 }, { hand: -1, z: -7 }, { hand: 1, z: -9, hero: true }];

  for (let t = 0; t < 8; t += 0.002) {

    if (dist < best) { best = dist; bt = t; }

  rail.touches.push([g.t0, g.t1]);
}

function restHand(f, s) {
  const S = shoulder(f, s);
  const flyRest = S.clone().addScaledVector(f.axis, 0.28).addScaledVector(f.front, 0.26).addScaledVector(f.right, s * 0.1);
  // neutral microgravity posture: arms float forward and out at chest height
  const upRest = S.clone().addScaledVector(f.axis, -0.2).addScaledVector(f.front, 0.3).addScaledVector(f.right, s * 0.3);

}

  // free phase: blend from the last release to the next grab through the rest pose
  const prev = mine.filter((g) => g.t1 < t).pop();
  const next = mine.find((g) => g.t0 > t);
  const rest = restHand(f, s);
  let pos = rest;
  if (next && next.t0 - t < 0.45) {

    pos = rest.clone().lerp(next.rail.grip, k);

function poseMan(t) {

  const hf = f.d.clone().addScaledVector(f.front, .35).normalize().lerp(V3(0, 0, -1), f.u).normalize();
  const hu = f.axis.clone().addScaledVector(hf, -f.axis.dot(hf)).normalize();
  const headC = neck.clone().addScaledVector(hu, 0.15);
  placeSeg(parts.torso, pelvis, chest); placeSeg(parts.neck, chest, headC);
  parts.pelvisB.position.copy(pelvis); parts.chestB.position.copy(chest);
  head.position.copy(headC);
  const hr = hu.clone().cross(hf).normalize().negate();
  head.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(hr, hu, hf));
  const out = {};
  for (const s of [-1, 1]) {
    const k = s < 0 ? "L" : "R";
    const S = shoulder(f, s);
    const T = handTarget(t, s, f);
    const pole = f.right.clone().multiplyScalar(s).addScaledVector(f.axis, -0.6).addScaledVector(f.front, -0.2);
    const [E, Hd] = twoBone(S, T, LEN.upper, LEN.fore, pole);

    parts["sho" + k].position.copy(S); parts["el" + k].position.copy(E); parts["hd" + k].position.copy(Hd);
    out["hand" + k] = Hd;
    // legs trail behind in flight and hang loosely upright at the hatch
    const hip = pelvis.clone().addScaledVector(f.right, s * 0.11);
    const sway = Math.sin(t * 2.3 + (s > 0 ? 0 : 2.4)) * 0.07 * (1 - f.u) + Math.sin(t * 1.1 + s) * 0.02 * f.u;
    const foot = hip.clone().addScaledVector(f.axis, -0.78).addScaledVector(f.front, 0.14 + sway).addScaledVector(f.right, s * 0.05);
    const [K, An] = twoBone(hip, foot, LEN.thigh, LEN.shin, f.front.clone());

    parts["hip" + k].position.copy(hip); parts["kn" + k].position.copy(K); parts["an" + k].position.copy(An);
    const fd = f.front.clone().multiplyScalar(.55).addScaledVector(f.axis, -.45 * (1 - f.u)).normalize();
    const toe = An.clone().addScaledVector(fd, 0.13);

const CAM3 = { pos: V3(-0.42, 0.45, -7.7), look: V3(-0.35, 0.02, -17) };

function placeCamera(t, tau, pose) {
  if (t < 4) {                                                           // shot 1: right side, locked, slight follow
    const target = pose.f.C.clone().lerp(V3(-1.0, -0.05, -6), .45);
    camera.position.set(1.15, 0.38, 0.4).add(shake(t, 0.012, 1.3));
    camera.lookAt(target); camera.fov = 50 - t * 1.2;
  } else if (t < 7) {                                                    // shot 2: hyper-zoom on the hand at rail 3B
    const G = HERO.rail.grip;
    const dir = V3(0.62, -0.32, -0.72).normalize();
    const k = easeOut((t - 4) / 0.22);
    const dist = lerp(2.8, 1.02, k) - (t - 4.22) * 0.04 * (t > 4.22);
    const hit = Math.max(0, 1 - (t - 4) / 0.45);
    camera.position.copy(G).addScaledVector(dir, dist).add(V3(0, 0.06, 0)).add(shake(t, 0.006 + hit * 0.03, 22));
    camera.lookAt(G.clone().add(V3(0.05, 0.07, 0.07)));
    camera.fov = lerp(52, 32, k);
  } else if (t < 12) {                                                   // shot 3: locked off behind, he floats away
    camera.position.copy(CAM3.pos).add(shake(t, 0.004, 0.9));
    camera.lookAt(CAM3.look); camera.fov = 52;
  } else {                                                               // shot 4: warp to the light
    const k = (t - 12) / 1.6;
    const e = easeIn(clamp(k));
    const via = [CAM3.pos, V3(0.42, 0.55, -15.2), V3(0.12, 0.2, Z_HATCH - 0.6), V3(0.1, 0.15, Z_HATCH - 3), BEACON.clone().multiplyScalar(1).setZ(BEACON.z + 60)];
    const curve = new THREE.CatmullRomCurve3(via);
    const s = clamp(e * 0.985 + clamp(k - 1) * .01);
    camera.position.copy(curve.getPoint(s)).add(shake(t, 0.01 * k, 30));
    const look = CAM3.look.clone().lerp(BEACON, smooth(0.0, 0.55, k));

}

const readoutsEl = $("#readouts");
const rEls = READOUTS.map((r) => {
  const el = document.createElement("div"); el.className = "readout";
  el.innerHTML = `<span class="lbl">${r.lbl}</span><span class="val">${r.val}<small>${r.unit}</small></span>${r.sub ? `<span class="sub">${r.sub}</span>` : ""}`;
  readoutsEl.appendChild(el); return el;
});
const CORNER = "NODE 2 · ARTEMIS-HAB 04\nMET <b>003:14:22:41</b>\nHANDRAILS <b>LIVE</b> · LENS <b>ONLINE</b>";
const siteImg = $("#siteimg");
let manifest = null; const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  imgCache.set(src, p); return p;
}
function siteFrame(seg, st) {
  const fr = manifest?.segments?.[seg]?.frames; if (!fr || !fr.length) return null;
  let best = fr[0]; for (const f of fr) { if (f.t <= st) best = f; else break; }
  return "build/site/" + best.f;
}
function zoomAt(keys, t) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [ta, ...a] = keys[i], [tb, ...b] = keys[Math.min(i + 1, keys.length - 1)];
  const k = tb > ta ? easeInOut((t - ta) / (tb - ta)) : 0;
  return a.map((v, j) => lerp(v, b[j], k));
}

let currentSrc = null;
async function drawOverlays(t, tau, pose) {
  const stage = $("#stage");
  // letterbox in the station shots, opens for the website
  const bar = t < 14 ? 92 : t < 15 ? 0 : 0;
  $("#bars").style.setProperty("--bar", bar + "px");

  // flashes: the drop, every strobe, the warp white-out, site cuts and the title hit
  let flash = 0;
  flash = Math.max(flash, 1 - clamp((t - 4.0) / 0.12));
  if (t < 4) flash = 0;
  for (const r of READOUTS) if (t >= r.t && t < r.t + .1) flash = Math.max(flash, 1 - (t - r.t) / .1);
  if (t >= 12.9 && t < 14) flash = Math.max(flash, smooth(12.9, 13.5, t));
  for (const e of SITE_EDL.slice(1)) if (t >= e.a && t < e.a + .08) flash = Math.max(flash, (1 - (t - e.a) / .08) * (e.punch ? .85 : .5));
  if (t >= 26 && t < 26.25) flash = Math.max(flash, 1 - (t - 26) / .25);
  if (t >= 7 && t < 7.06) flash = Math.max(flash, .6);
  $("#flash").style.opacity = flash.toFixed(3);
  $("#black").style.opacity = (t >= 14 && t < 15) ? 1 : 0;

  // RGB split on hits
  const rgbAmt = Math.max(t >= 4 && t < 4.3 ? 1 - (t - 4) / .3 : 0, ...READOUTS.map((r) => (t >= r.t && t < r.t + .18) ? 1 - (t - r.t) / .18 : 0),
    ...SITE_EDL.slice(1).map((e) => (t >= e.a && t < e.a + .15) ? 1 - (t - e.a) / .15 : 0));
  stage.style.filter = rgbAmt > 0.02 ? `drop-shadow(${(rgbAmt * 9).toFixed(1)}px 0 0 rgba(255,42,133,.55)) drop-shadow(${(-rgbAmt * 9).toFixed(1)}px 0 0 rgba(0,240,255,.55))` : "none";

  // corner HUD text (typewriter) in shot 1, back in shot 3
  const corner = $("#corner");
  if ((t > 0.3 && t < 4) || (t > 7.3 && t < 12)) {
    const k = t < 4 ? (t - 0.3) / 1.2 : (t - 7.3) / 1.0;
    const plain = CORNER.replace(/<\/?b>/g, "");
    const n = Math.floor(clamp(k) * plain.length);
    let shown = 0, html = "";
    for (const piece of CORNER.split(/(<\/?b>)/)) { if (piece.startsWith("<")) { html += piece; continue; } const take = Math.max(0, Math.min(piece.length, n - shown)); html += piece.slice(0, take); shown += piece.length; }
    corner.innerHTML = html + (Math.floor(t * 4) % 2 ? "▌" : "");
    corner.style.opacity = t < 4 ? 1 - smooth(3.6, 4, t) : 0.85;
  } else corner.style.opacity = 0;

  // reticle on the hand + readouts in shot 2
  const ret = $("#reticle");
  if (t >= 4.4 && t < 7) {
    const p = HERO.rail.grip.clone().project(camera);
    const x = (p.x * .5 + .5) * W, y = (-p.y * .5 + .5) * H;
    const k = easeOut((t - 4.4) / .25);
    const s = lerp(2.2, 1, k);
    ret.style.opacity = (k * (0.75 + 0.25 * Math.sin(t * 20))).toFixed(3);
    ret.style.transform = `translate(${x - 110}px, ${y - 110}px) scale(${s}) rotate(${(t * 40).toFixed(1)}deg)`;
  } else if (t >= 11.05 && t < 12.35) {                     // lock onto the distant light before the warp
    const p = BEACON.clone().project(camera);
    const x = (p.x * .5 + .5) * W, y = (-p.y * .5 + .5) * H;
    const k = easeOut((t - 11.05) / .3), s = lerp(1.1, 0.34, k) * (t > 12 ? 1 + (t - 12) * 3 : 1);
    ret.style.opacity = (k * (0.7 + 0.3 * Math.sin(t * 18)) * (1 - smooth(12.15, 12.35, t))).toFixed(3);
    ret.style.transform = `translate(${x - 110}px, ${y - 110}px) scale(${s}) rotate(${(t * 60).toFixed(1)}deg)`;
  } else ret.style.opacity = 0;
  READOUTS.forEach((r, i) => {
    const el = rEls[i]; const dt = t - r.t;
    if (t < 4 || t >= 7 || dt < 0) { el.style.opacity = 0; return; }
    // big in the centre for a beat, then it docks into the column on the right
    const big = 1 - easeInOut((dt - .16) / .14);
    const slotX = 1330, slotY = 190 + i * 148;
    const cx = 96, cy = 520;
    const x = lerp(slotX, cx, big), y = lerp(slotY, cy, big), sc = lerp(0.62, 1.65, big);
    el.style.opacity = 1;
    el.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
  });
  $("#simtag").style.opacity = t >= 4.5 && t < 7 ? .9 : 0;

  // website section
  const site = $("#site"), crt = $("#crt");
  const edl = SITE_EDL.find((e) => t >= e.a && t < e.b);
  if (edl && manifest) {
    site.style.display = "block";
    const st = edl.s0 + (t - edl.a) * edl.sp;
    const src = siteFrame(edl.seg, st);
    if (src && src !== currentSrc) { const im = await loadImg(src); if (im) { siteImg.src = im.src; currentSrc = src; } }
    let [cx, cy, sc] = zoomAt(edl.z, t);
    if (edl.punch) sc *= 1 + 0.08 * Math.max(0, 1 - (t - edl.a) / .25);   // overshoot on the cut
    const tx = clamp(W / 2 - cx * sc, W - W * sc, 0), ty = clamp(H / 2 - cy * sc, H - H * sc, 0);
    siteImg.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;
    // CRT power-on at 15 s
    const on = (t - 15) / .45;
    if (on < 1) {
      const vh = on < .5 ? 4 : lerp(4, H, easeOut((on - .5) / .5));
      site.style.clipPath = `inset(${((H - vh) / 2).toFixed(0)}px ${on < .5 ? ((1 - easeOut(on / .5)) * W / 2).toFixed(0) : 0}px)`;
      crt.style.opacity = on < .6 ? 1 : 1 - (on - .6) / .4; crt.style.height = (on < .5 ? 4 : vh) + "px";
    } else { site.style.clipPath = "none"; crt.style.opacity = 0; }
  } else { site.style.display = "none"; crt.style.opacity = 0; }

  // captions
  const cap = CAPTIONS.find((c) => t >= c.a + .12 && t < c.b);
  const capEl = $("#cap");
  if (cap) {
    capEl.querySelector(".k").textContent = cap.k; capEl.querySelector(".t").textContent = cap.t;
    const k = easeOut((t - cap.a - .12) / .2), out = smooth(cap.b - .1, cap.b, t);
    capEl.style.opacity = (k * (1 - out)).toFixed(3);
    capEl.style.transform = `translateX(${((1 - k) * -40).toFixed(1)}px)`;
    capEl.style.top = cap.top ? "110px" : "auto"; capEl.style.bottom = cap.top ? "auto" : "86px";
  } else capEl.style.opacity = 0;

  // title card
  const title = $("#title");
  if (t >= 26) {
    title.style.display = "flex";
    [[".t-a", 26.15], [".t-b", 26.0], [".t-c", 26.55], [".t-d", 27.0]].forEach(([s, at]) => title.querySelectorAll(s).forEach((el) => {
      const k = easeOut((t - at) / .45); el.style.opacity = k; el.style.transform = `translateY(${((1 - k) * 16).toFixed(1)}px)`;
    }));
    const b = title.querySelector(".t-b"); const k = easeOut((t - 26) / .5);
    b.style.transform = `scale(${lerp(1.18, 1, k).toFixed(4)})`;
    title.style.opacity = 1 - smooth(29.55, 30, t);
  } else title.style.display = "none";
  $("#vignette").style.opacity = t >= 15 && t < 26 ? .55 : 1;
  $("#scan").style.opacity = t >= 15 ? .35 : .5;
}

/* ======================= per-frame scene state ======================= */
function updateScene(t, tau) {
  const pose = poseMan(tau);
  // rail sensor glow on touch (and a small pre-glow as a hand approaches)
  for (const r of rails) {
    let e = 0;
    for (const [a, b] of r.touches) {
      if (tau >= a - .08 && tau <= b + .5) e = Math.max(e, tau < a ? (tau - a + .08) / .08 * .3 : tau <= b ? 1 : 1 - (tau - b) / .5);
    }
    r.sensMat.emissiveIntensity = 1.6 + e * 4.5;
    r.sensMat.emissive.setHex(e > .5 ? 0xbffcff : 0x00f0ff);
    r.glowMat.emissiveIntensity = .7 + e * 2.5;
  }
  // hatch: amber LEDs blink, unlock, slide open, then green
  const open = smooth(DOOR_T + 0.15, DOOR_T + 0.95, tau);
  const { door, hub, leds, glow, spill, glass, dring } = hatch.userData;
  hub.rotation.z = smooth(DOOR_T - 0.05, DOOR_T + 0.15, tau) * Math.PI / 2;
  door.position.x = open * 2.1;
  door.position.z = Z_HATCH - 0.08 - Math.min(open * 6, 1) * 0.0;
  leds.forEach((l, i) => {
    const on = tau > DOOR_T - .6 && tau < DOOR_T + 1 ? (Math.floor(tau * 6 + i * .5) % 2 ? 1 : .15) : .5;
    l.material.emissive.setHex(tau > DOOR_T + 1 ? 0x34d399 : 0xffb800);
    l.material.emissiveIntensity = tau > DOOR_T + 1 ? 2.4 : 2.4 * on;
  });
  glow.material.emissiveIntensity = 2 + open * 2;
  dring.material.emissiveIntensity = 2 * (1 - open);
  door.visible = open < 0.999;
  spill.intensity = open * 1.6;
  glass.visible = camera.position.z > Z_HATCH - 1.45;
  // the distant light pulses once the hatch is open
  const vis = smooth(DOOR_T + 0.9, DOOR_T + 1.6, tau);
  const pulse = 0.8 + 0.2 * Math.sin(t * 6.5);
  const base = 15 * vis * pulse;
  const warpK = clamp((t - 12) / 1.6);
  const near = camera.position.distanceTo(BEACON);
  const grow = t >= 12 ? lerp(1, 40, easeIn(warpK)) : 1;
  beacon.scale.setScalar(Math.max(base, 0.001) * grow * (near / 500));
  beacon.material.opacity = Math.min(1, vis + (t >= 12 ? 1 : 0));
  // warp streaks
  if (t >= 12 && t < 14) { const k = easeIn(warpK); setStreaks(k * 140, clamp(k * 1.2)); stars.material.opacity = 1; }
  else setStreaks(0, 0);
  bloom.strength = t >= 4 && t < 7 ? 0.45 : t >= 12 ? lerp(0.5, 2.0, warpK) : 0.5;
  man.visible = true;
  return pose;
}

async function seek(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  const tau = sceneTime(t);
  const inScene = t < 14;
  let pose = null;
  if (inScene) {
    pose = poseMan(tau);
    placeCamera(t, tau, pose);
    pose = updateScene(t, tau);
    composer.render();
    $("#gl").style.visibility = "visible";
  } else $("#gl").style.visibility = "hidden";
  await drawOverlays(t, tau, pose);
}

/* ======================= boot ======================= */
const ready = (async () => {
  try { manifest = await (await fetch("build/site/manifest.json", { cache: "no-store" })).json(); }
  catch { console.warn("No website frames yet: run video/capture_site.py"); }
  await document.fonts.ready;
  // re-draw the rail label now that the mono font is in
  rails.forEach(() => {});
  if (manifest) await Promise.all(Object.values(manifest.segments).flatMap((s) => s.frames.map((f) => loadImg("build/site/" + f.f))));
  await seek(0);
  $("#loading").remove();
})();
window.PROMO = { seek, ready, duration: DURATION, cues, fps: 30, _three: { beacon, camera, scene, THREE }, grabs: GRABS.map((g) => ({ z: g.z, hand: g.hand, t0: +g.t0.toFixed(3), t1: +g.t1.toFixed(3), best: +g.best.toFixed(3) })) };

// preview: fit the stage to the window; ?play runs in real time with the sound-effect track
const params = new URLSearchParams(location.search);
if (!params.has("render")) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $("#stage").style.transform = `scale(${s})`; };
  fit(); addEventListener("resize", fit);
  if (params.has("t")) ready.then(() => seek(parseFloat(params.get("t"))));
  if (params.has("play")) ready.then(() => {
    const audio = new Audio("build/promo-sfx.wav");
    const start = () => {
      const t0 = performance.now(); audio.currentTime = 0; audio.play().catch(() => {});
      const loop = () => { const t = (performance.now() - t0) / 1000; if (t < DURATION) { seek(t); requestAnimationFrame(loop); } };
      loop();
    };
    document.body.addEventListener("click", start, { once: true });
    $("#stage").insertAdjacentHTML("beforeend", '<div class="layer" id="clickplay" style="display:grid;place-items:center;font:400 22px var(--pixel);color:#00f0ff;background:rgba(0,0,0,.6)">CLICK TO PLAY</div>');
    document.body.addEventListener("click", () => $("#clickplay")?.remove(), { once: true });
  });
}
</script>
